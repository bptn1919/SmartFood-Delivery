# ================= DOCKER-COMPOSE.YML =================
services:
  # ========== CACHE ==========
  redis:
    image: phucnguyenbao/amomeal-redis:${TAG}
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - amomeal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BACKEND (Spring Boot) ==========
  backend:
    image: phucnguyenbao/amomeal-backend:${TAG}
    container_name: backend
    restart: unless-stopped
    environment:
      # Server
      SERVER_PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}

      # Database - PostgreSQL (JDBC URL built from the same pieces Django used)
      DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Auth & JWT
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_REFRESH_TOKEN_EXPIRES_IN: ${AUTH_REFRESH_TOKEN_EXPIRES_IN}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER}
      SECRET_KEY: ${SECRET_KEY}

      # Email
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_PORT: ${EMAIL_PORT}

      # PAYOS Payment
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_API_URL: ${PAYOS_API_URL}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY}
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID}

      # File storage - S3
      ATTACHMENT_STORAGE_BACKEND: s3
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_EXPIRES_IN: ${S3_EXPIRES_IN}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

      # Gemini AI (verification, recommendation, report severity)
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # AI review-analysis service
      AI_MODEL_BASE_URL: http://ai-service:8001

      # OTP expiration configs
      OTP_BANK_EXPIRE_MINUTES: ${OTP_BANK_EXPIRE_MINUTES}
      OTP_RESET_PASSWORD_EXPIRE_MINUTES: ${OTP_RESET_PASSWORD_EXPIRE_MINUTES}
      OTP_SIGNUP_EXPIRE_MINUTES: ${OTP_SIGNUP_EXPIRE_MINUTES}
      OTP_WITHDRAW_EXPIRE_MINUTES: ${OTP_WITHDRAW_EXPIRE_MINUTES}

      # Wallet secrets
      WALLET_CHAIN_SECRET: ${WALLET_CHAIN_SECRET}
    networks:
      - amomeal-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========== AI SERVICE ==========
  ai-service:
    image: phucnguyenbao/amomeal-ai:${TAG}
    container_name: ai-service
    restart: unless-stopped
    networks:
      - amomeal-network

  # ========== FRONTEND ==========
  frontend:
    image: phucnguyenbao/amomeal-frontend:${TAG}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:8000/api
      VITE_PAYOS_API_URL: ${PAYOS_API_URL}
      VITE_PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
      VITE_PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL}
    networks:
      - amomeal-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  amomeal-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
