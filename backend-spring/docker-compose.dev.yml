# Dev-only infra for running backend-spring locally (no volumes: data is discarded on `down`).
# Host ports are 15432/16379 (not 5432/6379) so they do not clash with a locally installed Postgres/Redis.
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: amomeal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DEV_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amomeal"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:latest
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"
